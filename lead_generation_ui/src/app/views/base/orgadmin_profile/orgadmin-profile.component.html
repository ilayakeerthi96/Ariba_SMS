<c-container class="mt-4" fluid>
  <c-row class="justify-content-center">
    <c-col xs="12" lg="8">

      <c-card class="border-0 shadow-lg" style="border-radius: 12px;">
        <c-card-header class="bg-white border-bottom px-4 pt-4 pb-3">
          <h5 class="mb-0 fw-bold">
            <i class="cil-user me-2 text-primary"></i>
            Edit Profile
          </h5>
        </c-card-header>

        <c-card-body class="p-4">

          <!-- Logo Upload Section -->
          <div class="text-center mb-4">
            <div class="logo-preview-wrapper mx-auto mb-3"
                 style="width:120px;height:120px;border:2px dashed #ccc;border-radius:12px;
                        display:flex;align-items:center;justify-content:center;overflow:hidden;">
              <img *ngIf="logoPreview" [src]="logoPreview" alt="Logo Preview"
                   style="width:100%;height:100%;object-fit:contain;" />
              <span *ngIf="!logoPreview" class="text-muted small">No Logo</span>
            </div>
            <label class="btn btn-outline-primary btn-sm">
              <i class="cil-camera me-1"></i> Upload Logo
              <input type="file" hidden accept="image/png,image/jpeg,image/jpg,image/gif,image/svg+xml"
                     (change)="onLogoSelected($event)" />
            </label>
            <div *ngIf="logoFile" class="mt-1 small text-muted">{{ logoFile.name }}</div>
          </div>

          <hr />

          <!-- Profile Form -->
          <form [formGroup]="profileForm">
            <c-row>
              <c-col xs="12" md="6" class="mb-3">
                <label cLabel class="fw-semibold">Full Name</label>
                <input cFormControl formControlName="fullName" placeholder="Full Name" />
              </c-col>
              <c-col xs="12" md="6" class="mb-3">
                <label cLabel class="fw-semibold">Phone</label>
                <input cFormControl formControlName="phone" placeholder="Phone" />
              </c-col>
              <c-col xs="12" md="6" class="mb-3">
                <label cLabel class="fw-semibold">Company Name</label>
                <input cFormControl formControlName="companyName" placeholder="Company Name" />
              </c-col>
              <c-col xs="12" md="6" class="mb-3">
                <label cLabel class="fw-semibold">Organization Name</label>
                <input cFormControl formControlName="organizationName"
                       placeholder="Organization Name" />
              </c-col>
              <c-col xs="12" class="mb-3">
                <label cLabel class="fw-semibold">New Password
                  <small class="text-muted">(leave blank to keep current)</small>
                </label>
                <input cFormControl formControlName="password" type="password"
                       placeholder="New Password (optional)" />
              </c-col>
            </c-row>
          </form>

          <c-alert *ngIf="errorMessage" color="danger" class="mt-3">{{ errorMessage }}</c-alert>
          <c-alert *ngIf="successMessage" color="success" class="mt-3">{{ successMessage }}</c-alert>

        </c-card-body>

        <c-card-footer class="bg-white border-top px-4 py-3 d-flex gap-2">
          <button cButton color="primary" (click)="saveProfile()" [disabled]="isSaving">
            <span *ngIf="!isSaving"><i class="cil-save me-2"></i>Save Changes</span>
            <span *ngIf="isSaving">
              <span class="spinner-border spinner-border-sm me-2"></span>Saving...
            </span>
          </button>
          <button cButton color="light" (click)="uploadLogo()" [disabled]="!logoFile || isUploadingLogo">
            <span *ngIf="!isUploadingLogo"><i class="cil-cloud-upload me-2"></i>Upload Logo</span>
            <span *ngIf="isUploadingLogo">
              <span class="spinner-border spinner-border-sm me-2"></span>Uploading...
            </span>
          </button>
        </c-card-footer>
      </c-card>

    </c-col>
  </c-row>
</c-container>
