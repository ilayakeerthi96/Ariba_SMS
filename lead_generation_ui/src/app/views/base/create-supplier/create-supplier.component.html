<div class="container mt-4">
  <c-card class="p-3">

    
<h4>{{ mode === 'create' ? 'Create New Supplier' : 'Edit Supplier' }}</h4>

<p class="text-muted">
  {{ mode === 'create' ? 'Enter details for the Supplier' : 'Update the Supplier details' }}
</p>

    <form [formGroup]="supplierForm">
      <div class="row g-3">

        <!-- Company Name -->
        <div class="col-md-6">
          <label class="form-label">
            Company Name <span class="required-star">*</span>
          </label>

          <input
            type="text"
            formControlName="companyName"
            class="form-control"
          />

          <div class="error-text"
            *ngIf="supplierForm.get('companyName')?.invalid && supplierForm.get('companyName')?.touched">
            Company name is required.
          </div>
        </div>

        <!-- Company Address -->
        <div class="col-md-6">
          <label class="form-label">
            Company Address <span class="required-star">*</span>
          </label>

          <input
            type="text"
            formControlName="companyAddress"
            class="form-control"
          />

          <div class="error-text"
            *ngIf="supplierForm.get('companyAddress')?.invalid && supplierForm.get('companyAddress')?.touched">
            Company address is required.
          </div>
        </div>

        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label">
            Name <span class="required-star">*</span>
          </label>

          <input
            type="text"
            formControlName="name"
            class="form-control"
          />

          <div class="error-text"
            *ngIf="supplierForm.get('name')?.invalid && supplierForm.get('name')?.touched">
            Name is required.
          </div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label">
            Email <span class="required-star">*</span>
          </label>

          <input
            type="email"
            formControlName="email"
            class="form-control"
          />

          <div class="error-text"
            *ngIf="supplierForm.get('email')?.invalid && supplierForm.get('email')?.touched">
            Valid email is required.
          </div>
        </div>

        <!-- Password -->
    <div class="col-md-6">
  <label class="form-label">
    Password
  </label>

  <div class="input-group">
    <input 
      [type]="showPassword ? 'text' : 'password'"
      formControlName="password"
      class="form-control"
    />

    <button 
      type="button" 
      class="btn btn-outline-secondary"
      (click)="togglePassword()"
      tabindex="-1"
    >
      <i class="fa" 
         [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'">
      </i>
    </button>
  </div>
</div>

      </div>

      <!-- Submit Button -->
      <div class="mt-4">
        <button 
          type="button" 
          class="btn btn-primary"
          (click)="onSubmit()"
          [disabled]="supplierForm.invalid">
          Submit
        </button>
      </div>

    </form>

  </c-card>
</div>
