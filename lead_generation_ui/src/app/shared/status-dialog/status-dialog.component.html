<h2 mat-dialog-title [ngClass]="data.status === 'success' ? 'text-success' : 'text-danger'">
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close color="primary">OK</button>
</mat-dialog-actions>
