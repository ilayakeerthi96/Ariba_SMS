<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RFQ Published</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; }
        .header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 30px; text-align: center; }
        .header h1 { color: white; margin: 0; font-size: 24px; }
        .content { padding: 30px; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📢 RFQ Published</h1>
        </div>
        
        <div class="content">
            <p>Dear <strong th:text="${approverName}">Approver</strong>,</p>
            
            <p>The RFQ you approved has been successfully published to suppliers.</p>
            
            <h3 th:text="${rfqNumber}">RFQ-001</h3>
            <h4 th:text="${rfqTitle}">Title</h4>
            
            <p><strong>Published Date:</strong> <span th:text="${publishedDate}">Date</span></p>
            <p><strong>Suppliers Notified:</strong> <span th:text="${suppliersCount}">5</span></p>
        </div>
        
        <div class="footer">
            <p>© 2025 Your Company. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
