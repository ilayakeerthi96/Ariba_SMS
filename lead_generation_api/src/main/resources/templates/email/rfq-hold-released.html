<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RFQ Hold Released</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; }
        .header { background: linear-gradient(135deg, #10b981 0%, #059669 100%); padding: 30px; text-align: center; }
        .header h1 { color: white; margin: 0; font-size: 24px; }
        .content { padding: 30px; }
        .success-box { background: #d4edda; border-left: 4px solid #28a745; padding: 15px; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 30px; background: #10b981; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; }
        .footer { background: #f8f9fa; padding: 20px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>▶️ RFQ Hold Released</h1>
        </div>
        
        <div class="content">
            <p>Dear <strong th:text="${approverName}">Approver</strong>,</p>
            
            <div class="success-box">
                <strong>✅ Hold Released</strong><br>
                The RFQ hold has been released and requires your approval.
            </div>
            
            <h3 th:text="${rfqNumber}">RFQ-001</h3>
            <h4 th:text="${rfqTitle}">Title</h4>
            
            <p><strong>Released By:</strong> <span th:text="${releaserName}">Name</span></p>
            <p><strong>Date:</strong> <span th:text="${releasedDate}">Date</span></p>
            
            <p><strong>Release Comments:</strong></p>
            <p th:text="${releaseRemarks}">Comments</p>
            
            <!-- <div style="text-align: center;">
                <a th:href="${approvalUrl}" class="btn">Review RFQ</a>
            </div> -->
        </div>
        
        <div class="footer">
            <p>© 2025 Your Company. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
