# # ============================================
# # Logging
# # ============================================
# logging:
#   level:
#     root: INFO
#     com.itti.leadcapturing: DEBUG
#     org.springframework.security: DEBUG
#     org.springframework.web: DEBUG
#     org.hibernate.SQL: DEBUG
#     org.hibernate.type.descriptor.sql.BasicBinder: TRACE

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lead_capture_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Admin@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: false
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        LazyInitializationException: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
      fail-on-empty-beans: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false 

# ============================================
# JWT Configuration
# ============================================
# JWT Configuration (MUST match Gateway)
jwt:
  secret: SuperSecretKeyForJWTTokenSigningThatMeetsHS512SecurityRequirementsWith64BytesMinimumLength2024
  expiration: 3600000



# ============================================
# Server Configuration
# ============================================
server:
  port: 9092
  servlet:
    context-path: /leadcapture
  compression:
    enabled: true
    min-response-size: 1024
    error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never  # Changed to never for production
    include-exception: false

# ============================================
# Logging
# ============================================
logging:
  level:
    root: INFO
    com.itti.leadcapturing: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction: DEBUG  # ✅ ADDED: Transaction debugging
    org.springframework.orm.jpa: DEBUG  # ✅ NEW: Shows JPA/Hibernate transaction logs
    org.hibernate.engine.transaction: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"