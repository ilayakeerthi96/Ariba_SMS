spring:
  cloud:
  
    discovery:
      enabled: true
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  application:
    name: spring-security
  jpa:
    # Provide database platform that is being used
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      # New database is created when application starts and destroyed when application is stopped
      ddl-auto: none
    # Show sql when spring data jpa performs query
    show-sql: true
    properties:
      hibernate:
        # Format queries
        format_sql: true
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  datasource:
    # URL connection to database (spring-security is database name)time_sheet
    url:  jdbc:mysql://localhost:3306/dev_itti_timesheet?allowPublicKeyRetrieval=true&useSSL=false
    #customer_tracking_db
    username: root
    password: Admin@123
  h2:
    console:
      enabled: true
token:
  signing:
    key: SAADSSAASDASDKSANDKASDNASKD34234234324FSDFDSFSDKNSDKFNDSFNSDFNS68568565406509
  expirationTime: 3600000

timesheet:
  url: http://localhost:9090





