<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="5" xl="4">
        <c-card-group>
          <c-card class="p-4 shadow-lg border-0" style="border-radius: 12px;">
            <c-card-body>
              <!-- Company Logo -->
              <div class="text-center mb-4">
                <img src="assets/images/ITTI-Logo.png" alt="Company Logo" style="height: 60px;" class="mb-2" />
                <h4 class="mt-3 fw-semibold text-muted">Welcome Back</h4>
                <p class="small text-muted">Sign in to your account</p>
              </div>

              <!-- Single Unified Login Form -->
              <form [formGroup]="loginForm" (ngSubmit)="unifiedLogin()">
                
                <!-- Email Input -->
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input 
                    formControlName="email" 
                    cFormControl 
                    placeholder="Email Address"
                    type="email"
                    [class.is-invalid]="submitted && loginF['email'].errors"
                    (input)="clearError()" />
                </c-input-group>
                <div *ngIf="submitted && loginF['email'].errors" class="text-danger mb-2 small">
                  <span *ngIf="loginF['email'].errors['required']">Email is required.</span>
                  <span *ngIf="loginF['email'].errors['email']">Please enter a valid email address.</span>
                </div>

                <!-- Password Input -->
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input 
                    formControlName="password" 
                    cFormControl 
                    type="password" 
                    placeholder="Password"
                    [class.is-invalid]="submitted && loginF['password'].errors"
                    (input)="clearError()" />
                </c-input-group>
                <div *ngIf="submitted && loginF['password'].errors" class="text-danger mb-3 small">
                  <span *ngIf="loginF['password'].errors['required']">Password is required.</span>
                </div>

                <!-- Login Button -->
                <c-row class="justify-content-center">
                  <c-col xs="12" class="text-center">
                    <button 
                      type="submit" 
                      cButton 
                      class="px-4 w-100 fw-semibold" 
                      color="primary"
                      [disabled]="isLoading">
                      <span *ngIf="!isLoading">Sign In</span>
                      <span *ngIf="isLoading">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Signing in...
                      </span>
                    </button>
                  </c-col>
                </c-row>

                <!-- Error Message -->
                <c-alert color="danger" *ngIf="errorMessage" class="py-2 my-3 small text-center">
                  {{ errorMessage }}
                </c-alert>

                <!-- Success Message -->
                <c-alert color="success" *ngIf="successMessage" class="py-2 my-3 small text-center">
                  {{ successMessage }}
                </c-alert>
              </form>

            </c-card-body>

            <!-- Footer -->
            <div class="text-center small text-muted pb-2">
              © 2025 ITTI. All Rights Reserved.
            </div>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
